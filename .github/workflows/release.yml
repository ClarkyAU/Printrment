name: Release

# Builds the Windows exe and the Linux AppImage and publishes them as a GitHub
# Release for the version in cmd/printrment/server.go. Start it from the
# Actions tab (Release > Run workflow), or push a tag like v0.31.
# (The Docker image is built by docker.yml.)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false

      - name: Work out the version
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(sed -n 's/^const version = "\(.*\)"/\1/p' cmd/printrment/server.go)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $v"; exit 1
          fi
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Release v$v already exists - bump the version first"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Test
        run: GOFLAGS=-mod=mod GOPROXY=off go test ./cmd/printrment

      - name: Build
        run: |
          scripts/build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.v.outputs.version }}
          cat > notes.md <<NOTES
          **Downloads**
          - **Windows:** \`Printrment.exe\`, just run it
          - **Linux (any distribution):** \`Printrment-$v-x86_64.AppImage\`, then \`chmod +x\` it and run it ([notes]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/linux.md))
          - **Docker / TrueNAS:** \`ghcr.io/clarkyau/printrment:$v\` ([setup]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/docker-truenas.md))
          NOTES
          sha256sum build/Printrment.exe build/Printrment-*.AppImage | sed 's#build/##' > build/SHA256SUMS.txt
          gh release create "v$v" --target "$GITHUB_SHA" --title "Printrment $v" --notes-file notes.md \
            build/Printrment.exe build/Printrment-*.AppImage build/SHA256SUMS.txt
